<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>Study Assistant</title>
  <style>
    :root { --blue:#1769e0; --bg:#f5f7fb; --line:#dce2ea; --text:#172033; --muted:#64748b; }
    * { box-sizing:border-box; }
    html, body { height:100%; margin:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); }
    .app { height:100%; max-width:820px; margin:0 auto; background:#fff; display:flex; flex-direction:column; box-shadow:0 0 30px rgba(15,23,42,.08); }
    header { padding:16px 18px 12px; border-bottom:1px solid var(--line); background:#fff; }
    h1 { margin:0; font-size:20px; }
    .meta { margin-top:5px; color:var(--muted); font-size:12px; }
    .notice { padding:9px 18px; background:#eff6ff; color:#334155; font-size:12px; border-bottom:1px solid #dbeafe; }
    #messages { flex:1; overflow-y:auto; padding:18px; scroll-behavior:smooth; }
    .row { display:flex; margin:0 0 14px; }
    .row.user { justify-content:flex-end; }
    .bubble { max-width:84%; padding:11px 13px; border-radius:15px; white-space:pre-wrap; overflow-wrap:anywhere; line-height:1.45; font-size:15px; }
    .assistant .bubble { background:#f1f5f9; border-bottom-left-radius:4px; }
    .user .bubble { background:var(--blue); color:#fff; border-bottom-right-radius:4px; }
    .error .bubble { background:#fff1f2; color:#9f1239; }
    form { display:flex; gap:9px; align-items:flex-end; padding:12px 14px calc(12px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); background:#fff; }
    textarea { flex:1; min-height:44px; max-height:140px; resize:none; border:1px solid #cbd5e1; border-radius:12px; padding:11px 12px; font:inherit; outline:none; }
    textarea:focus { border-color:var(--blue); box-shadow:0 0 0 3px rgba(23,105,224,.12); }
    button { min-height:44px; border:0; border-radius:12px; background:var(--blue); color:#fff; font-weight:650; padding:0 18px; cursor:pointer; }
    button:disabled, textarea:disabled { opacity:.55; cursor:not-allowed; }
    #fatal { display:none; margin:18px; padding:16px; border:1px solid #fecdd3; border-radius:12px; background:#fff1f2; color:#9f1239; line-height:1.5; }
    @media (max-width:600px) { .app { box-shadow:none; } .bubble { max-width:90%; } }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <h1>Study Assistant</h1>
      <div class="meta" id="studyLabel"></div>
    </header>
    <div class="notice">Please do not enter your name, email address, phone number, or other identifying information.</div>
    <div id="fatal" role="alert"></div>
    <section id="messages" aria-live="polite"></section>
    <form id="chatForm">
      <textarea id="messageInput" maxlength="4000" rows="1" placeholder="Type your message…" aria-label="Message"></textarea>
      <button id="sendButton" type="submit">Send</button>
    </form>
  </main>

  <script>
    const WORKER_URL = "https://llm-study-backend.ethicalinteractionlab.workers.dev";
    const params = new URLSearchParams(window.location.search);
    const studyId = (params.get("sid") || "").trim();
    const condition = (params.get("condition") || "").trim().toLowerCase();
    const validId = /^[A-Za-z0-9_-]{3,80}$/.test(studyId);
    const validCondition = ["intervention", "control"].includes(condition);

    const messagesEl = document.getElementById("messages");
    const form = document.getElementById("chatForm");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const fatal = document.getElementById("fatal");
    const studyLabel = document.getElementById("studyLabel");
    const storageKey = `llm-study-chat:${studyId}:${condition}`;

    let conversationId = "";
    let savedMessages = [];
    let busy = false;

    function addMessage(role, text, extraClass = "") {
      const row = document.createElement("div");
      row.className = `row ${role} ${extraClass}`.trim();
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messagesEl.appendChild(row);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return bubble;
    }

    function saveState() {
      localStorage.setItem(storageKey, JSON.stringify({ conversationId, messages: savedMessages }));
    }

    function loadState() {
      try {
        const state = JSON.parse(localStorage.getItem(storageKey) || "null");
        if (state && typeof state === "object") {
          conversationId = typeof state.conversationId === "string" ? state.conversationId : "";
          savedMessages = Array.isArray(state.messages) ? state.messages.slice(-100) : [];
        }
      } catch (_) {}
      if (savedMessages.length) {
        savedMessages.forEach(m => addMessage(m.role, m.text));
      } else {
        addMessage("assistant", "Hello! You can begin by asking a question.");
      }
    }

    function setBusy(value) {
      busy = value;
      input.disabled = value;
      sendButton.disabled = value;
      sendButton.textContent = value ? "Sending…" : "Send";
    }

    function processSseBlock(block, bubble, currentText) {
      const dataText = block.split("\n")
        .filter(line => line.startsWith("data:"))
        .map(line => line.slice(5).trim())
        .join("\n");
      if (!dataText || dataText === "[DONE]") return currentText;
      let event;
      try { event = JSON.parse(dataText); } catch (_) { return currentText; }
      if (event.conversation_id) conversationId = event.conversation_id;
      if ((event.event === "message" || event.event === "agent_message") && typeof event.answer === "string") {
        currentText += event.answer;
        bubble.textContent = currentText;
        messagesEl.scrollTop = messagesEl.scrollHeight;
      }
      if (event.event === "error") throw new Error(event.message || "The assistant returned an error.");
      return currentText;
    }

    async function sendMessage(message) {
      const bubble = addMessage("assistant", "");
      let assistantText = "";
      const response = await fetch(`${WORKER_URL}/chat`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message, studyId, condition, conversationId })
      });
      if (!response.ok) {
        let detail = "";
        try { detail = (await response.json()).error || ""; } catch (_) {}
        throw new Error(detail || `Request failed (${response.status}).`);
      }
      if (!response.body) throw new Error("No response stream was received.");
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      while (true) {
        const { value, done } = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), { stream: !done });
        const blocks = buffer.split(/\r?\n\r?\n/);
        buffer = blocks.pop() || "";
        for (const block of blocks) assistantText = processSseBlock(block, bubble, assistantText);
        if (done) break;
      }
      if (buffer.trim()) assistantText = processSseBlock(buffer, bubble, assistantText);
      if (!assistantText.trim()) throw new Error("The assistant did not return a message.");
      savedMessages.push({ role: "assistant", text: assistantText });
      saveState();
    }

    if (!validId || !validCondition) {
      fatal.style.display = "block";
      fatal.textContent = "This study link is incomplete. Please return to the survey and open the assigned link or QR code again.";
      messagesEl.style.display = "none";
      form.style.display = "none";
    } else {
      studyLabel.textContent = `Study ID: ${studyId}`;
      loadState();
    }

    form.addEventListener("submit", async event => {
      event.preventDefault();
      if (busy) return;
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      input.style.height = "auto";
      addMessage("user", message);
      savedMessages.push({ role: "user", text: message });
      saveState();
      setBusy(true);
      try {
        await sendMessage(message);
      } catch (error) {
        addMessage("assistant", "Sorry, the message could not be sent. Please check your connection and try again.", "error");
        console.error(error);
      } finally {
        setBusy(false);
        input.focus();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = `${Math.min(input.scrollHeight, 140)}px`;
    });

    input.addEventListener("keydown", event => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });
  </script>
</body>
</html>
